name: Nightly

# 聚合各组件的滚动预发布 `nightly`，发布为本仓库的滚动预发布 `nightly`（--latest=false）。
#
# - 时间：UTC 17:30（台北 01:30），给各组件 UTC 16:00 的 nightly 留出构建时间。
# - 组件还没有 nightly 时，回退到它的 latest 正式版。
# - 生成 nightly-manifest.json，记录每个组件的 tag 与提交 sha，并作为附件保存。
#   只有当它与上一次聚合 nightly 的 nightly-manifest.json 不同才发布，否则跳过。
#   发布失败时旧 manifest 不变，下次运行会自动重试。
# 逻辑在 scripts/aggregate.sh 中。
#
# pull_request 只做 dry-run（收集、校验、生成正文），不发布。
# 只使用 GITHUB_TOKEN；组件仓库都是公开的，跨仓库下载 Release 附件不需要 PAT。

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nightly.yml'
      - 'scripts/aggregate.sh'

permissions:
  contents: read

concurrency:
  group: aggregate-nightly
  cancel-in-progress: false

jobs:
  verify:
    name: 验证（dry-run）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 收集组件 nightly（不发布）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/aggregate.sh nightly --dry-run

  nightly:
    name: 聚合并发布 nightly
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 收集组件 nightly 并在有变化时发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/aggregate.sh nightly
